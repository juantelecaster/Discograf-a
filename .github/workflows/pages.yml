name: Publicar colección musical

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Activar mejoras de la web
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<option value="year">Orden: año</option>', '<option value="year_asc">Año: más antiguo primero</option><option value="year_desc">Año: más reciente primero</option>')
          s = s.replace('fichas con identificación alta', 'álbumes bien identificados')
          s = s.replace('fichas que requieren revisión', 'identificación incompleta')
          scripts = '<script src="patch-v41.js?v=20260818f"></script><script src="covers-sort-v2.js?v=20260818f"></script><script src="diary-curiosity-v3.js?v=20260818f"></script><script src="app-fixes-v4.js?v=20260818f"></script><script src="ficha-listening-v5.js?v=20260818f"></script><script src="listened-badge-v1.js?v=20260818f"></script><script src="listening-history-v1.js?v=20260818f"></script><script src="catalog-enrichment-v1.js?v=20260818f"></script><script src="ficha-comment-delete-v1.js?v=20260818f"></script><script src="listening-history-delete-v2.js?v=20260818f"></script><script src="catalog-additions-v1.js?v=20260818f"></script><script src="catalog-corrections-v2.js?v=20260818f"></script>'
          if 'catalog-corrections-v2.js' not in s:
              s = s.replace('</body>', scripts + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
