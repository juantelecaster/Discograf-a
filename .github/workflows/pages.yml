name: Publicar colección musical

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Activar mejoras de la web
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          scripts = '<script src="patch-v41.js"></script><script src="covers-sort-v2.js"></script><script src="diary-curiosity-v3.js"></script>'
          if 'diary-curiosity-v3.js' not in s:
              s = s.replace('</body>', scripts + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
