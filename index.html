<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colección musical de Juan</title><style>body{margin:0;background:#0b0d12;color:#f4f6fb;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.box{max-width:560px;padding:28px;text-align:center}.spin{width:42px;height:42px;border:4px solid #283247;border-top-color:#f3bc5d;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}#err{color:#ffaaaa;white-space:pre-wrap}</style></head><body><div class="box"><div class="spin"></div><h2>Cargando tu colección musical…</h2><p>Preparando el inventario, las favoritas y el diario de escucha.</p><div id="err"></div></div><script>(async()=>{try{const u=['data/part1.txt','data/part2.txt','data/part3.txt','data/part4.txt'];const p=await Promise.all(u.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(x+' '+r.status);return r.text()})));const b=p.join('').trim();const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(txt);document.close()}catch(e){document.querySelector('.spin').style.display='none';document.getElementById('err').textContent='No se pudo cargar la colección.\n'+e}})();</script></body></html>
